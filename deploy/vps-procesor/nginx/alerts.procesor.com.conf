# Created by the AGI PROCESOR project in 2026.
# Install as /etc/nginx/sites-available/agi-procesor-alerts, then symlink it to
# sites-enabled. Certbot may add the TLS listener after the HTTP config works.

limit_req_zone $binary_remote_addr zone=agi_procesor_api:10m rate=60r/m;
map $http_upgrade $agi_procesor_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name alerts.procesor.com;
    server_tokens off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        limit_req zone=agi_procesor_api burst=5 nodelay;

        proxy_pass http://127.0.0.1:8088/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        auth_basic "AGI PROCESOR Alerts";
        auth_basic_user_file /etc/nginx/.htpasswd-agi-procesor;

        limit_req zone=agi_procesor_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agi_procesor_connection_upgrade;

        # Root-owned file containing only:
        # proxy_set_header Authorization "Bearer <OPENJARVIS_API_KEY>";
        include /etc/nginx/snippets/agi-procesor-api-key.conf;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header X-Powered-By;
    }
}
